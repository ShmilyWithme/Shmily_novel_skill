name: Software checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile novel_writer_gui.py build_release.py
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONIOENCODING: utf-8
      - run: git diff --check

  windows-build:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - run: python build_release.py
        env:
          PYTHONIOENCODING: utf-8
      - run: python tests/smoke_release.py
        env:
          PYTHONIOENCODING: utf-8
      - uses: actions/upload-artifact@v4
        with:
          name: novel-writer-windows
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
